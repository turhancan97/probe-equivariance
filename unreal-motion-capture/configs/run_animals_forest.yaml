# Example run: only the "animals" category, recorded in the forest environment.
assets_catalog: "assets.yaml"
environment: forest

select:
  names: ["all"]
  categories: ["animals"]

output_dir: "C:/Users/turha/Documents/Unreal Projects/spatial_intelligence/Content/Python/unreal-motion-capture/output"
image_width: 448
image_height: 448
yield_time: 1.0

modes: ["camera_orbit"]

camera_line:
  distance_x: 1100
  height: 120
  line_half_span: 600
  steps: 60

camera_orbit:
  radius: 1000
  height: 175
  steps: 60

object_line:
  distance_x: 2500
  height: 350
  line_half_span: 600
  steps: 60

object_orbit:
  radius: 800
  height: 350
  camera_distance_x: 2500
  steps: 60
