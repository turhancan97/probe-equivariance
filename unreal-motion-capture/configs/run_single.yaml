# Example run: exactly one asset, in exactly one environment.
# Swap the "name" and "environment" values below for quick one-off tests.
assets_catalog: "assets.yaml"
environment: FirstPersonMap                  # one of: city, forest, bridge, desert, winter_town, FirstPersonMap

select:
  names: ["cube"]                   # exactly one object name from assets.yaml

output_dir: "C:/Users/turha/Documents/Unreal Projects/spatial_intelligence/Content/Python/probe-equivariance/unreal-motion-capture/output"
image_width: 448
image_height: 448
yield_time: 1.0

modes: ["camera_orbit", "object_orbit", "camera_line", "object_line"]

camera_line:
  distance_x: 700
  height: 120
  line_half_span: 600
  steps: 360

camera_orbit:
  radius: 700
  height: 250
  steps: 360

object_line:
  distance_x: 1200
  height: 120
  line_half_span: 500
  steps: 360

object_orbit:
  radius: 500
  height: 250
  camera_distance_x: 1200
  steps: 360
